services:
  nginx:
    build:
      context: .
      dockerfile: ./docker_files/nginx.Dockerfile
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server:/var/www
      - ./scripts:/var/scripts
      - ./nginx/examples:/etc/nginx/examples
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/logs:/var/log/nginx
      - ./env.json:/var/environment/env.json
    command: ["sh", "-c", "/var/scripts/auto-add-template.sh && /var/scripts/entrypoint.sh"]
    depends_on:
      - php-8
      - php-7
    networks:
      - app-network

  php-8:
    build:
      context: .
      dockerfile: ./docker_files/php8.Dockerfile
    container_name: php8_container
    volumes:
      - ./server/source_php8.2:/var/www/source_php8.2
      - ./scripts:/var/scripts
      - ./configs/php8/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf
      - ./configs/php8/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    working_dir: /var/www/source_php8.2
    ports:
      - "9003:9003" # Mở cổng Xdebug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  php-7:
     build:
       context: .
       dockerfile: ./docker_files/php7.Dockerfile
     container_name: php7_container
     volumes:
       - ./server/source_php7.4:/var/www/source_php7.4
       - ./scripts:/var/scripts
       - ./configs/php7.4/php.ini:/usr/local/etc/php/php.ini
     working_dir: /var/www/source_php7.4
     networks:
       - app-network

  redis:
    build:
      context: .
      dockerfile: ./docker_files/redis.Dockerfile
    container_name: redis_container
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    build:
      context: .
      dockerfile: ./docker_files/mysql.Dockerfile
    container_name: mysql_container
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # Cho phép mật khẩu trống cho root
      MYSQL_ROOT_PASSWORD: "1"
    ports:
      - "3306:3306"  # Ánh xạ cổng 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_container
    ports:
      - "5672:5672"   # Cổng AMQP (cho ứng dụng kết nối)
      - "15672:15672" # Cổng UI Web
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - app-network

volumes:
  mysql-data:  # Khai báo volume mysql-data
    driver: local  # Dùng driver local (mặc định)
    name: mysql-data  # Tên volume
  redis-data:
    driver: local
    name: redis-data

networks:
  app-network:
    driver: bridge
