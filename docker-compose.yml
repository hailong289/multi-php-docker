services:
  nginx:
    build:
      context: .
      dockerfile: docker_files/nginx.Dockerfile
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./server:/var/www
      - ./scripts:/var/scripts
      - ./nginx/templates:/etc/nginx/templates
    command: ["sh", "-c", "/var/scripts/entrypoint.sh"]
    depends_on:
      - php-8
      - php-7
    networks:
      - app-network

  php-8:
    build:
      context: .
      dockerfile: docker_files/php8.Dockerfile
    container_name: php8_container
    volumes:
      - ./server/source_php8.2:/var/www/source_php8.2
      - ./scripts:/var/scripts
      - ./configs/php8/php.ini:/usr/local/etc/php/php.ini
      - ./composer-cache:/root/.composer # shared cache
      - ./configs/supervisord.conf:/etc/supervisord.conf
    working_dir: /var/www/source_php8.2
    networks:
      - app-network

  php-7:
     build:
       context: .
       dockerfile: docker_files/php7.Dockerfile
     container_name: php7_container
     volumes:
       - ./server/source_php7.4:/var/www/source_php7.4
       - ./scripts:/var/scripts
       - ./configs/php7.4/php.ini:/usr/local/etc/php/php.ini
       - ./composer-cache:/root/.composer # shared cache
     working_dir: /var/www/source_php7.4
     networks:
       - app-network

  redis:
    build:
        context: .
        dockerfile: docker_files/redis.Dockerfile
    container_name: redis_container
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    build:
      context: .
      dockerfile: docker_files/mysql.Dockerfile
    container_name: mysql_container
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # Cho phép mật khẩu trống cho root
      MYSQL_ROOT_PASSWORD: "1"
    ports:
      - "3306:3306"  # Ánh xạ cổng 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    restart: always
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
        - app-network

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - app-network


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_container
    ports:
      - "5672:5672"   # Cổng AMQP (cho ứng dụng kết nối)
      - "15672:15672" # Cổng UI Web
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - app-network

volumes:
  mysql-data:  # Khai báo volume mysql-data
    driver: local  # Dùng driver local (mặc định)
    name: mysql-data  # Tên volume
  redis-data:
    driver: local
    name: redis-data

networks:
  app-network:
    driver: bridge
