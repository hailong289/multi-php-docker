services:
  nginx:
    image: long301001/server-php:nginx-arm
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./web:/var/www
      - ./scripts:/var/scripts
      - ./nginx/templates:/etc/nginx/templates
    command: ["sh", "-c", "/var/scripts/entrypoint.sh"]
    depends_on:
      - php-8
      - php-7
    networks:
      - app-network

  php-8:
    image: long301001/server-php:php8.2-arm
    container_name: php8_container
    volumes:
      - ./web:/var/www
      - ./scripts:/var/scripts
      - ./configs/php8/php.ini:/usr/local/etc/php/php.ini
      - ./composer-cache:/root/.composer # shared cache
      - ./configs/supervisord.conf:/etc/supervisord.conf
    working_dir: /var/www
    networks:
      - app-network

  php-7:
     image: long301001/server-php:php7.4-arm
     container_name: php7_container
     volumes:
       - ./web:/var/www
       - ./scripts:/var/scripts
       - ./configs/php7.4/php.ini:/usr/local/etc/php/php.ini
       - ./composer-cache:/root/.composer # shared cache
     working_dir: /var/www
     networks:
       - app-network

  redis:
    image: long301001/server-php:redis-arm
    container_name: redis_container
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    image: long301001/server-php:mysql-arm
    container_name: mysql_container
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # Cho phép mật khẩu trống cho root
      MYSQL_ROOT_PASSWORD: "1"
    ports:
      - "3306:3306"  # Ánh xạ cổng 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network

  rabbitmq:
    image: long301001/server-php:rabbitmq-arm
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Cổng AMQP (cho ứng dụng kết nối)
      - "15672:15672" # Cổng UI Web
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin

volumes:
  mysql-data:  # Khai báo volume mysql-data
    driver: local  # Dùng driver local (mặc định)
    name: mysql-data  # Tên volume
  redis-data:
    driver: local
    name: redis-data

networks:
  app-network:
    driver: bridge
