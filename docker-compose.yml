services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx_container
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./web:/var/www
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php-8
    #      - php-7
    networks:
      - app-network

  php-8:
    build:
      context: .
      dockerfile: php_configs/php8/php8.Dockerfile
    container_name: php8-container
    volumes:
      - ./web:/var/www
      - ./scripts:/var/scripts
      - ./composer-cache:/root/.composer  # cache Composer và tránh phải cài lại mỗi lần
    working_dir: /var/www
    command: [ "/bin/bash", "-c", "chmod +x /var/scripts/start-php8.sh && /var/scripts/start-php8.sh" ]
    networks:
      - app-network

  # php-7:
  #   build:
  #     context: .
  #     dockerfile: php_configs/php7.4/php7.Dockerfile
  #   container_name: php7-container
  #   volumes:
  #     - ../www:/var/www/app
  #   networks:
  #     - app-network

  redis:
    image: redis:alpine
    container_name: redis_container
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # Cho phép mật khẩu trống cho root
      MYSQL_ROOT_PASSWORD: "1"
    ports:
      - "3306:3306"  # Ánh xạ cổng 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network

volumes:
  mysql-data:  # Khai báo volume mysql-data
    driver: local  # Dùng driver local (mặc định)
    name: mysql-data  # Tên volume
  redis-data:
    driver: local
    name: redis-data

networks:
  app-network:
    driver: bridge
