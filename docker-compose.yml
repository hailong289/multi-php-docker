services:
  env-init:
    image: alpine:latest
    container_name: env_init_container
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        if [ ! -f env.json ]; then
          cp env.example.json env.json
          echo "Created env.json from env.example.json"
        else
          echo "env.json already exists; keeping current configuration"
        fi
    restart: "no"

  nginx:
    image: long301001/multi-php-docker:nginx
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server:/var/www
      - ./scripts:/var/scripts
      - ./nginx/examples:/etc/nginx/examples
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/logs:/var/log/nginx
      - ./runtime:/var/runtime
      - type: bind
        source: ./env.json
        target: /var/environment/env.json
        bind:
          create_host_path: false
    command: ["sh", "-c", "/var/scripts/auto-add-template.sh && /var/scripts/entrypoint.sh"]
    depends_on:
      env-init:
        condition: service_completed_successfully
      php-8.2:
        condition: service_started
    networks:
      - app-network

  php-8.0:
    profiles: ["php-8.0"]
    image: long301001/multi-php-docker:php-8.0
    container_name: php8.0_container
    volumes:
      - ./server/source_php8.0:/var/www/source_php8.0
      - ./scripts:/var/scripts
      - ./configs/php8.0/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf
    working_dir: /var/www/source_php8.0
    networks:
      - app-network

  php-8.1:
    profiles: ["php-8.1"]
    image: long301001/multi-php-docker:php-8.1
    container_name: php8.1_container
    volumes:
      - ./server/source_php8.1:/var/www/source_php8.1
      - ./scripts:/var/scripts
      - ./configs/php8.1/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf
    working_dir: /var/www/source_php8.1
    networks:
      - app-network

  php-8.2:
    image: long301001/multi-php-docker:php-8.2
    container_name: php8.2_container
    volumes:
      - ./server/source_php8.2:/var/www/source_php8.2
      - ./scripts:/var/scripts
      - ./configs/php8/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf
    working_dir: /var/www/source_php8.2
    networks:
      - app-network

  php-7.4:
     profiles: ["php-7.4"]
     image: long301001/multi-php-docker:php-7.4
     container_name: php7.4_container
     volumes:
       - ./server/source_php7.4:/var/www/source_php7.4
       - ./scripts:/var/scripts
       - ./configs/php7.4/php.ini:/usr/local/etc/php/php.ini
     working_dir: /var/www/source_php7.4
     networks:
       - app-network

  supervisor:
    image: long301001/multi-php-docker:php-8.2
    container_name: supervisor_container
    volumes:
      - ./server/source_php8.2:/var/www/source_php8.2
      - ./scripts:/var/scripts
      - ./configs/php8/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf:ro
      - ./configs/supervisor.d:/etc/supervisor/conf.d:ro
      - ./logs/supervisor:/var/log/supervisor
    working_dir: /var/www/source_php8.2
    command: ["/var/scripts/supervisord.sh"]
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - app-network

  manager:
    image: long301001/multi-php-docker:php-8.2
    container_name: manager_container
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./server/manager:/app:ro
      - ./runtime:/runtime
      - type: bind
        source: ./env.json
        target: /data/env.json
        bind:
          create_host_path: false
    working_dir: /app
    environment:
      MANAGER_ENV_PATH: /data/env.json
      MANAGER_RUNTIME_PATH: /runtime
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/app"]
    depends_on:
      env-init:
        condition: service_completed_successfully
    networks:
      - app-network

  redis:
    image: long301001/multi-php-docker:redis-alpine
    container_name: redis_container
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    image: long301001/multi-php-docker:mysql
    container_name: mysql_container
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # Cho phép mật khẩu trống cho root
      MYSQL_ROOT_PASSWORD: "1"
    ports:
      - "3306:3306"  # Ánh xạ cổng 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network


  rabbitmq:
    image: long301001/multi-php-docker:rabbitmq-3-management
    container_name: rabbitmq_container
    ports:
      - "5672:5672"   # Cổng AMQP (cho ứng dụng kết nối)
      - "15672:15672" # Cổng UI Web
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - app-network

volumes:
  mysql-data:  # Khai báo volume mysql-data
    driver: local  # Dùng driver local (mặc định)
    name: mysql-data  # Tên volume
  redis-data:
    driver: local
    name: redis-data

networks:
  app-network:
    driver: bridge
