include:
  - path: compose/php-8.5.yml
    project_directory: .
  - path: compose/php-8.4.yml
    project_directory: .
  - path: compose/php-8.3.yml
    project_directory: .
  - path: compose/php-8.2.yml
    project_directory: .
  - path: compose/php-8.1.yml
    project_directory: .
  - path: compose/php-8.0.yml
    project_directory: .
  - path: compose/php-7.4.yml
    project_directory: .
  - path: compose/redis.yml
    project_directory: .
  - path: compose/rabbitmq.yml
    project_directory: .
  - path: compose/mysql.yml
    project_directory: .
  - path: compose/postgres.yml
    project_directory: .
  - path: compose/kafka.yml
    project_directory: .
  - path: compose/mailpit.yml
    project_directory: .
  - path: compose/minio.yml
    project_directory: .

services:
  env-init:
    image: alpine:latest
    container_name: env_init_container
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        # Keep env.json at the project root. Do not bind-mount that file directly:
        # when it is missing, Docker Desktop on Windows creates a host *directory*
        # named env.json (macOS usually does not). Mount the project directory
        # instead and read ./env.json inside the container.
        if [ -d env.json ]; then
          echo "Removing invalid env.json directory left by a previous bind mount"
          rm -rf env.json
        fi

        # Move back from the short-lived environment/ layout if present
        if [ -f environment/env.json ] && [ ! -f env.json ]; then
          mv environment/env.json env.json
          echo "Moved environment/env.json back to ./env.json"
        fi
        if [ -d environment/env.json ]; then
          rm -rf environment/env.json
        fi

        if [ ! -f env.json ]; then
          cp env.example.json env.json
          echo "Created env.json from env.example.json"
        else
          echo "env.json already exists; keeping current configuration"
        fi
    restart: "no"

  nginx:
    image: multi-php-local:nginx
    build:
      context: .
      dockerfile: ./docker_files/nginx.Dockerfile
    container_name: nginx_container
    # Image is pulled but no container is created until Manager sets NGINX_SCALE=1 in .env.
    scale: ${NGINX_SCALE:-0}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./server:/var/www
      - ./scripts:/var/scripts
      - ./nginx/examples:/etc/nginx/examples
      - ./nginx/welcome:/usr/share/nginx/welcome:ro
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl
      - ./runtime:/var/runtime
      - .:/var/host-project:ro
    environment:
      ENV_JSON_FILE: /var/host-project/env.json
    command: ["sh", "-c", "/var/scripts/nginx/auto-add-template.sh && exec /var/scripts/docker/entrypoint.sh"]
    depends_on:
      env-init:
        condition: service_completed_successfully
    networks:
      - app-network

  dns:
    image: coredns/coredns:1.11.3
    container_name: dns_container
    command: ["-conf", "/etc/coredns/Corefile"]
    # Host-side wildcard DNS (opt-in, scripts/hosts/wildcard_dns.sh); loopback only.
    ports:
      - "127.0.0.1:${DNS_HOST_PORT:-10053}:10053/udp"
      - "127.0.0.1:${DNS_HOST_PORT:-10053}:10053/tcp"
    volumes:
      - ./configs/coredns:/etc/coredns:ro
      - ./runtime/coredns:/etc/coredns-records:ro
    restart: unless-stopped
    networks:
      app-network:
        # PHP services list this IP under `dns:`; Docker only accepts an IP there.
        ipv4_address: ${APP_DNS_IP:-10.213.53.53}

  manager:
    image: multi-php-local:manager
    build:
      context: .
      dockerfile: ./docker_files/manager.Dockerfile
    container_name: manager_container
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime:/runtime
      - ./php-controller-runtime:/runtime/php-controller
      - ./nginx/logs:/nginx-logs
      - .:/var/host-project
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    environment:
      MANAGER_ENV_PATH: /var/host-project/env.json
      MANAGER_RUNTIME_PATH: /runtime
      MANAGER_PHP_CONTROLLER_PATH: /runtime/php-controller
      MANAGER_NGINX_LOGS_PATH: /nginx-logs
      MANAGER_DOCKER_SOCK: /var/run/docker.sock
      # php -S is otherwise single-threaded; terminal + status SSE + actions must overlap.
      PHP_CLI_SERVER_WORKERS: "12"
    command: ["php", "-d", "memory_limit=512M", "-S", "0.0.0.0:8080", "-t", "/app/public", "/app/router.php"]
    restart: unless-stopped
    depends_on:
      env-init:
        condition: service_completed_successfully
      dns:
        condition: service_started
    # Site health probes resolve domains like PHP containers do (see SiteHealth::probe).
    dns:
      - ${APP_DNS_IP:-10.213.53.53}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    # Fixed subnet so the dns service gets a known IP. Outside Docker's default pools (172.17-31, 192.168);
    # if it clashes with a LAN/VPN, set APP_SUBNET and APP_DNS_IP in .env.
    ipam:
      config:
        - subnet: ${APP_SUBNET:-10.213.53.0/24}
