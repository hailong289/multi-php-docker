version: '3.8'

services:
  php-8:
    build:
      context: .
      dockerfile: php_configs/php8/php8.Dockerfile
    container_name: php8-container
    volumes:
      - ./web/hola-framework:/var/www/hola-framework
      - ./web/spa-fnb-retail:/var/www/spa-fnb-retail
      - ./composer-cache:/root/.composer  # cache Composer và tránh phải cài lại mỗi lần
    working_dir: /var/www
    command: >
      bash -c "
        composer install --working-dir=/var/www/hola-framework && 
        php-fpm
      "
    networks:
      - app-network

  # php-7:
  #   build:
  #     context: .
  #     dockerfile: php_configs/php7.4/php7.Dockerfile
  #   container_name: php7-container
  #   volumes:
  #     - ../www:/var/www/app
  #   networks:
  #     - app-network

  redis:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    networks:
      - app-network

  nginx:
    build:
        context: .
        dockerfile: nginx/Dockerfile
    container_name: nginx_container
    env_file:
      - .env
    volumes:
      - ./web/hola-framework:/var/www/hola-framework
      - ./web/spa-fnb-retail:/var/www/spa-fnb-retail
    ports:
      - "80:80"
    depends_on:
      - php-8
#      - php-7
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
