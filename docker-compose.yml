include:
  - path: compose/php-8.2.yml
    project_directory: .
  - path: compose/php-8.1.yml
    project_directory: .
  - path: compose/php-8.0.yml
    project_directory: .
  - path: compose/php-7.4.yml
    project_directory: .
  - path: compose/redis.yml
    project_directory: .
  - path: compose/rabbitmq.yml
    project_directory: .
  - path: compose/mysql.yml
    project_directory: .

services:
  env-init:
    image: alpine:latest
    container_name: env_init_container
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        # Keep env.json at the project root. Do not bind-mount that file directly:
        # when it is missing, Docker Desktop on Windows creates a host *directory*
        # named env.json (macOS usually does not). Mount the project directory
        # instead and read ./env.json inside the container.
        if [ -d env.json ]; then
          echo "Removing invalid env.json directory left by a previous bind mount"
          rm -rf env.json
        fi

        # Move back from the short-lived environment/ layout if present
        if [ -f environment/env.json ] && [ ! -f env.json ]; then
          mv environment/env.json env.json
          echo "Moved environment/env.json back to ./env.json"
        fi
        if [ -d environment/env.json ]; then
          rm -rf environment/env.json
        fi

        if [ ! -f env.json ]; then
          cp env.example.json env.json
          echo "Created env.json from env.example.json"
        else
          echo "env.json already exists; keeping current configuration"
        fi
    restart: "no"

  nginx:
    image: long301001/multi-php-docker:nginx
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server:/var/www
      - ./scripts:/var/scripts
      - ./nginx/examples:/etc/nginx/examples
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/logs:/var/log/nginx
      - ./runtime:/var/runtime
      - .:/var/host-project:ro
    environment:
      ENV_JSON_FILE: /var/host-project/env.json
    command: ["sh", "-c", "/var/scripts/nginx/auto-add-template.sh && /var/scripts/docker/entrypoint.sh"]
    depends_on:
      env-init:
        condition: service_completed_successfully
      php-8.2:
        condition: service_started
    networks:
      - app-network

  manager:
    image: long301001/multi-php-docker:php-8.2
    container_name: manager_container
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./server/manager:/app:ro
      - ./runtime:/runtime
      - ./php-controller-runtime:/runtime/php-controller
      - ./nginx/logs:/nginx-logs:ro
      - .:/var/host-project
    working_dir: /app
    environment:
      MANAGER_ENV_PATH: /var/host-project/env.json
      MANAGER_RUNTIME_PATH: /runtime
      MANAGER_PHP_CONTROLLER_PATH: /runtime/php-controller
      MANAGER_NGINX_LOGS_PATH: /nginx-logs
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/app/public", "/app/router.php"]
    depends_on:
      env-init:
        condition: service_completed_successfully
    networks:
      - app-network

  php-controller:
    image: docker:cli
    container_name: php_controller_container
    entrypoint: ["/bin/sh", "/scripts/php/php-controller.sh"]
    environment:
      # Absolute host path of this repo (written by ensure_hosts_env.*). Used to
      # rewrite compose bind mounts when creating optional PHP containers.
      HOST_PROJECT_PATH: ${HOST_PROJECT_PATH:-/project}
      # docker:cli image is read-only; compose build needs a writable Docker config dir.
      DOCKER_CONFIG: /tmp/docker-config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts:/scripts:ro
      - ./php-controller-runtime:/runtime
      # Long syntax avoids "too many colons" with Windows D:/ paths in short form.
      - type: bind
        source: ${HOST_PROJECT_PATH:-.}
        target: /project
        read_only: true
    working_dir: /project
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    network_mode: none

networks:
  app-network:
    driver: bridge
