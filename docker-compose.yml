services:
  nginx:
    build:
      context: .
      dockerfile: docker_files/nginx.Dockerfile
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./web:/var/www
      - ./scripts:/var/scripts
      - ./nginx/templates:/etc/nginx/templates
    entrypoint: ["/var/scripts/entrypoint.sh"]
    depends_on:
      - php-8
      - php-7
    networks:
      - app-network

  composer:
    image: composer:latest
    container_name: composer_container
    working_dir: /var/www
    volumes:
      - ./web:/var/www
      - composer_data:/usr/local/bin/composer

  php-8:
    build:
      context: .
      dockerfile: docker_files/php8.Dockerfile
    container_name: php8_container
    volumes:
      - composer_data:/usr/local/bin/composer
      - ./web:/var/www
      - ./scripts:/var/scripts
      - ./php_configs/php8/php.ini:/usr/local/etc/php/php.ini
    working_dir: /var/www
    entrypoint: ["/var/scripts/start-php8.sh"]
    depends_on:
      - composer
    networks:
      - app-network

  php-7:
     build:
       context: .
       dockerfile: docker_files/php7.Dockerfile
     container_name: php7_container
     volumes:
       - composer_data:/usr/local/bin/composer
       - ./web:/var/www
       - ./scripts:/var/scripts
       - ./php_configs/php7.4/php.ini:/usr/local/etc/php/php.ini
     working_dir: /var/www
     entrypoint: [ "/var/scripts/start-php7.sh" ]
     depends_on:
       - composer
     networks:
       - app-network

  redis:
    image: long301001/server-php:redis
    container_name: redis_container
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    image: long301001/server-php:mysql-8
    container_name: mysql_container
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # Cho phép mật khẩu trống cho root
      MYSQL_ROOT_PASSWORD: "1"
    ports:
      - "3306:3306"  # Ánh xạ cổng 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network

volumes:
  mysql-data:  # Khai báo volume mysql-data
    driver: local  # Dùng driver local (mặc định)
    name: mysql-data  # Tên volume
  redis-data:
    driver: local
    name: redis-data
  composer_data:
    driver: local
    name: composer_data

networks:
  app-network:
    driver: bridge
