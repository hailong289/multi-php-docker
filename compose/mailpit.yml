services:
  mailpit:
    image: multi-php-local:mailpit
    profiles: ["mailpit"]
    build:
      context: .
      dockerfile: ./docker_files/mailpit.Dockerfile
    container_name: mailpit_container
    hostname: mailpit
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_WEB_HOST_PORT:-8025}:8025"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
