services:
  php-7.4:
    profiles: ["php-7.4"]
    image: long301001/multi-php-docker:php-7.4
    container_name: php7.4_container
    volumes:
      - ./server/source:/var/www/source
      - ./scripts:/var/scripts
      - ./configs/php7.4/php.ini:/usr/local/etc/php/php.ini
    working_dir: /var/www/source
    networks:
      - app-network

  supervisor-7.4:
    profiles: ["supervisor-7.4"]
    image: long301001/multi-php-docker:php-7.4
    container_name: supervisor74_container
    volumes:
      - ./server/source:/var/www/source
      - ./scripts:/var/scripts
      - ./configs/php7.4/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf:ro
      - ./configs/supervisor.d/php7.4:/etc/supervisor/conf.d:ro
      - ./logs/supervisor-7.4:/var/log/supervisor
    working_dir: /var/www/source
    command: ["/var/scripts/docker/supervisord.sh"]
    depends_on:
      mysql:
        condition: service_started
        required: false
      postgres:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
      kafka:
        condition: service_started
        required: false
      mailpit:
        condition: service_started
        required: false
      minio:
        condition: service_started
        required: false
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
