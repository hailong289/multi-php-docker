services:
  php-7.4:
    profiles: ["php-7.4"]
    image: multi-php-local:php-7.4
    build:
      context: .
      dockerfile: ./docker_files/php7.Dockerfile
    container_name: php7.4_container
    volumes:
      - ./server/source:/var/www/source
      - ./scripts:/var/scripts
      - ./runtime/composer:/opt/composer:ro
      - ./scripts/composer/bin/composer:/usr/local/sbin/composer:ro
      - ./configs/php7.4/php.ini:/usr/local/etc/php/php.ini
    working_dir: /var/www/source
    environment:
      COMPOSER_PHP_SERVICE: php-7.4
    depends_on:
      dns:
        condition: service_started
        required: false
    dns:
      - ${APP_DNS_IP:-10.213.53.53}
    networks:
      - app-network

  supervisor-7.4:
    profiles: ["supervisor-7.4"]
    image: multi-php-local:php-7.4
    container_name: supervisor74_container
    volumes:
      - ./server/source:/var/www/source
      - ./scripts:/var/scripts
      - ./configs/php7.4/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf:ro
      - ./configs/supervisor.d/php7.4:/etc/supervisor/conf.d:ro
      - ./logs/supervisor-7.4:/var/log/supervisor
    working_dir: /var/www/source
    command: ["/var/scripts/docker/supervisord.sh"]
    depends_on:
      dns:
        condition: service_started
        required: false
      mysql:
        condition: service_started
        required: false
      postgres:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
      kafka:
        condition: service_started
        required: false
      mailpit:
        condition: service_started
        required: false
      minio:
        condition: service_started
        required: false
    dns:
      - ${APP_DNS_IP:-10.213.53.53}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
