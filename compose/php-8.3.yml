services:
  php-8.3:
    profiles: ["php-8.3"]
    build:
      context: ./docker_files
      dockerfile: php8.3.Dockerfile
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    image: multi-php-local:php-8.3
    container_name: php8.3_container
    volumes:
      - ./server/source:/var/www/source
      - ./scripts:/var/scripts
      - ./configs/php8.3/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf
    working_dir: /var/www/source
    networks:
      - app-network

  supervisor-8.3:
    profiles: ["supervisor-8.3"]
    image: multi-php-local:php-8.3
    container_name: supervisor83_container
    volumes:
      - ./server/source:/var/www/source
      - ./scripts:/var/scripts
      - ./configs/php8.3/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf:ro
      - ./configs/supervisor.d/php8.3:/etc/supervisor/conf.d:ro
      - ./logs/supervisor-8.3:/var/log/supervisor
    working_dir: /var/www/source
    command: ["/var/scripts/docker/supervisord.sh"]
    depends_on:
      mysql:
        condition: service_started
        required: false
      postgres:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
      kafka:
        condition: service_started
        required: false
      mailpit:
        condition: service_started
        required: false
      minio:
        condition: service_started
        required: false
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
