services:
  rabbitmq:
    profiles: ["rabbitmq"]
    image: long301001/multi-php-docker:rabbitmq-3-management
    container_name: rabbitmq_container
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
