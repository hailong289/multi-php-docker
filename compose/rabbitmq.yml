services:
  rabbitmq:
    profiles: ["rabbitmq"]
    image: multi-php-local:rabbitmq-3-management
    build:
      context: .
      dockerfile: ./docker_files/rabbitMQ.Dockerfile
    container_name: rabbitmq_container
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
