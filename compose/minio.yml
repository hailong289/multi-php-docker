services:
  minio:
    image: multi-php-local:minio
    profiles: ["minio"]
    build:
      context: .
      dockerfile: ./docker_files/minio.Dockerfile
    container_name: minio_container
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network

volumes:
  minio-data:
    driver: local
    name: minio-data

networks:
  app-network:
    driver: bridge
