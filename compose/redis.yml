services:
  redis:
    image: long301001/multi-php-docker:redis-alpine
    build:
      context: .
      dockerfile: ./docker_files/redis.Dockerfile
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    container_name: redis_container
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  redis-data:
    driver: local
    name: redis-data

networks:
  app-network:
    driver: bridge
