services:
  php-8.1:
    profiles: ["php-8.1"]
    image: multi-php-local:php-8.1
    build:
      context: .
      dockerfile: ./docker_files/php8.1.Dockerfile
    container_name: php8.1_container
    volumes:
      - ./server/source:/var/www/source
      - ./scripts:/var/scripts
      - ./runtime/composer:/opt/composer:ro
      - ./scripts/composer/bin/composer:/usr/local/sbin/composer:ro
      - ./configs/php8.1/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf
    working_dir: /var/www/source
    environment:
      COMPOSER_PHP_SERVICE: php-8.1
    depends_on:
      dns:
        condition: service_started
        required: false
    dns:
      - ${APP_DNS_IP:-10.213.53.53}
    networks:
      - app-network

  supervisor-8.1:
    profiles: ["supervisor-8.1"]
    image: multi-php-local:php-8.1
    container_name: supervisor81_container
    volumes:
      - ./server/source:/var/www/source
      - ./scripts:/var/scripts
      - ./configs/php8.1/php.ini:/usr/local/etc/php/php.ini
      - ./configs/supervisord.conf:/etc/supervisord.conf:ro
      - ./configs/supervisor.d/php8.1:/etc/supervisor/conf.d:ro
      - ./logs/supervisor-8.1:/var/log/supervisor
    working_dir: /var/www/source
    command: ["/var/scripts/docker/supervisord.sh"]
    depends_on:
      dns:
        condition: service_started
        required: false
      mysql:
        condition: service_started
        required: false
      postgres:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
      kafka:
        condition: service_started
        required: false
      mailpit:
        condition: service_started
        required: false
      minio:
        condition: service_started
        required: false
    dns:
      - ${APP_DNS_IP:-10.213.53.53}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
