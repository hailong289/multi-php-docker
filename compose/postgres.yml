services:
  postgres:
    image: long301001/multi-php-docker:postgres
    profiles: ["postgres"]
    build:
      context: .
      dockerfile: ./docker_files/postgres.Dockerfile
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - app-network

volumes:
  postgres-data:
    driver: local
    name: postgres-data

networks:
  app-network:
    driver: bridge
