name: Build Desktop App

# Tag desktop-vX.Y.Z (matching desktop/src-tauri/tauri.conf.json "version") → build and publish a GitHub Release.
# Push to desktop/** on master/main or run manually → build only, files kept as workflow artifacts.
on:
  push:
    branches: [master, main]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "desktop-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version} (expected desktop-v${version})."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Rust tests
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build (and publish when tagged)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Multi PHP Desktop __VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: |
            App desktop mở Server Manager trong cửa sổ riêng, có nút khởi động Docker và stack. Cần Docker (Docker Desktop, OrbStack, …) và repo multi-php-docker trên máy.

            **Tải file**
            - macOS Apple Silicon (M1/M2/…): `Multi.PHP_*_aarch64.dmg`
            - macOS Intel: `Multi.PHP_*_x64.dmg`
            - Windows: `Multi.PHP_*_x64-setup.exe` (hoặc `.msi`)

            **macOS: app chưa ký số Apple.** Lần đầu mở, macOS sẽ chặn. Vào **System Settings → Privacy & Security** và bấm **Open Anyway**, hoặc chạy:
            `xattr -dr com.apple.quarantine "/Applications/Multi PHP.app"`

            **Windows:** SmartScreen có thể cảnh báo, bấm **More info → Run anyway**.

      - name: Upload build files
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-php-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
