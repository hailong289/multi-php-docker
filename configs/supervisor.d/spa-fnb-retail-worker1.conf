; =========================================================
; Redis: push notification
; =========================================================
[program:spa_fnb_redis_push]
directory=/var/www/source_php8.2/spa-fnb-retail
command=php artisan queue:work redis --queue=push_notification --sleep=1 --tries=3 --timeout=300 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=330
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/spa-fnb-redis-push.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; =========================================================
; Redis: import và các tác vụ nền khác
; Queue bên trái có độ ưu tiên cao hơn
; =========================================================
[program:spa_fnb_redis_business]
directory=/var/www/source_php8.2/spa-fnb-retail
command=php artisan queue:work redis --queue=import_product,sync_order,webhook,handle_einvoice,default --sleep=1 --tries=3 --timeout=12000 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=12030
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/spa-fnb-redis-business.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

