; /etc/supervisor/conf.d/spa-fnb-retail-worker.conf

; =========================================================
; RabbitMQ mặc định: mail, callback và job không chỉ định queue
; =========================================================
[program:spa_fnb_rabbitmq_default]
directory=/var/www/source_php8.2/spa-fnb-retail
command=php artisan queue:work rabbitmq --queue=spa_fnb_retail_test_local_queue --sleep=3 --tries=3 --timeout=12000 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=12030
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/spa-fnb-rabbitmq-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

