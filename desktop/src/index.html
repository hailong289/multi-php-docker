<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi PHP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="launcher">
      <header class="brand">
        <img src="icon.svg" alt="" width="56" height="56" />
        <div>
          <h1>Multi PHP</h1>
          <p>Môi trường PHP chạy bằng Docker</p>
        </div>
      </header>

      <section id="pick" class="pick" hidden>
        <h2>Chọn thư mục dự án</h2>
        <p>Thư mục chứa <code>docker-compose.yml</code> của Multi PHP, ví dụ <code>~/web</code>.</p>
        <p id="pick-error" class="error" hidden></p>
        <button id="pick-btn" class="primary" type="button">Chọn thư mục…</button>
      </section>

      <section id="main" hidden>
        <ol class="steps">
          <li id="docker-step" class="step" data-state="off">
            <span class="node" aria-hidden="true"><span class="num">1</span></span>
            <div class="step-body">
              <span class="step-name">Docker</span>
              <span id="docker-text" class="step-state"></span>
            </div>
            <span class="step-actions">
              <a id="docker-download" class="btn" href="https://www.docker.com/products/docker-desktop/" hidden>Tải Docker Desktop</a>
              <button id="docker-open" class="btn" type="button" hidden>Khởi động Docker</button>
            </span>
          </li>
          <li id="manager-step" class="step" data-state="off">
            <span class="node" aria-hidden="true"><span class="num">2</span></span>
            <div class="step-body">
              <span class="step-name">Manager</span>
              <span id="manager-text" class="step-state"></span>
            </div>
            <span class="step-actions">
              <button id="build-btn" class="btn ghost" type="button" hidden title="docker compose build, rồi khởi động">Build lại</button>
              <button id="up-btn" class="btn" type="button" hidden>Khởi động</button>
            </span>
          </li>
        </ol>

        <button id="open-btn" class="primary open" type="button" disabled>Mở Manager</button>
        <p id="open-hint" class="open-hint"></p>

        <div id="log-wrap" class="log-wrap" hidden>
          <pre id="log" class="log" aria-live="polite"></pre>
          <p id="log-result" class="log-result"></p>
        </div>

        <footer class="dir">
          <span>Thư mục</span>
          <code id="dir"></code>
          <button id="change-dir" class="link" type="button">Đổi</button>
        </footer>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
